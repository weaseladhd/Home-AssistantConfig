---
substitutions:
  device_name: sprinklers
  device_description: "DIY Sprinklers system"

  # Safety: auto-off time per zone (change if you want)
  zone_auto_off: 45min

esphome:
  name: ${device_name}
  comment: "${device_description}"
  friendly_name: sprinklers
  area: Outside
esp8266:
  board: esp01_1m
  # name_add_mac_suffix: true

wifi:
  min_auth_mode: WPA2
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Watchdog-style reboot if WiFi can't connect for a while
  reboot_timeout: 10min

  ap:
    ssid: ${device_name}

captive_portal:

web_server:
  port: 80

logger:
  baud_rate: 0  # free up UART pins on ESP8266

api:
  encryption:
    key: !secret sprinklers_api_encryption_key

ota:
  platform: esphome
  password: !secret sprinklers_ota_password

uart:
  baud_rate: 115200
  tx_pin: GPIO1
  rx_pin: GPIO3

# Track whether each zone is currently on (for safe timer behavior)
globals:
  - id: zone1_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: zone2_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: zone3_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: zone4_on
    type: bool
    restore_value: false
    initial_value: "false"

# Auto-off timers implemented as restartable scripts
script:
  - id: zone1_auto_off
    mode: restart
    then:
      - delay: ${zone_auto_off}
      - if:
          condition:
            lambda: return id(zone1_on);
          then:
            - switch.turn_off: relay1

  - id: zone2_auto_off
    mode: restart
    then:
      - delay: ${zone_auto_off}
      - if:
          condition:
            lambda: return id(zone2_on);
          then:
            - switch.turn_off: relay2

  - id: zone3_auto_off
    mode: restart
    then:
      - delay: ${zone_auto_off}
      - if:
          condition:
            lambda: return id(zone3_on);
          then:
            - switch.turn_off: relay3

  - id: zone4_auto_off
    mode: restart
    then:
      - delay: ${zone_auto_off}
      - if:
          condition:
            lambda: return id(zone4_on);
          then:
            - switch.turn_off: relay4

sensor:
  - platform: uptime
    name: "Sprinkler uptime"
    update_interval: 60s
    id: uptime_sensor
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = (int) round(id(uptime_sensor).raw_state);

              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);

              int hours = seconds / 3600;
              seconds = seconds % 3600;

              int minutes = seconds / 60;
              seconds = seconds % 60;

              String s;
              if (days)    s += String(days) + "d ";
              if (hours)   s += String(hours) + "h ";
              if (minutes) s += String(minutes) + "m ";
              s += String(seconds) + "s";

              return std::string(s.c_str());

  - platform: wifi_signal
    name: "Wifi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "Sprinkler Version"

  - platform: wifi_info
    ip_address:
      name: "Sprinkler IP"
    ssid:
      name: "Sprinkler SSID"
    bssid:
      name: "Sprinkler BSSID"

  - platform: template
    name: "Sprinkler Uptime Human Readable"
    id: uptime_human
    icon: mdi:clock-start

switch:
  - platform: template
    name: "Zone 1"
    id: relay1
    turn_on_action:
      - uart.write: [0xA0, 0x01, 0x01, 0xA2]
      - lambda: id(zone1_on) = true;
      - script.execute: zone1_auto_off
    turn_off_action:
      - uart.write: [0xA0, 0x01, 0x00, 0xA1]
      - lambda: id(zone1_on) = false;
      - script.stop: zone1_auto_off
    optimistic: true

  - platform: template
    name: "Zone 2"
    id: relay2
    turn_on_action:
      - uart.write: [0xA0, 0x02, 0x01, 0xA3]
      - lambda: id(zone2_on) = true;
      - script.execute: zone2_auto_off
    turn_off_action:
      - uart.write: [0xA0, 0x02, 0x00, 0xA2]
      - lambda: id(zone2_on) = false;
      - script.stop: zone2_auto_off
    optimistic: true

  - platform: template
    name: "Zone 3"
    id: relay3
    turn_on_action:
      - uart.write: [0xA0, 0x03, 0x01, 0xA4]
      - lambda: id(zone3_on) = true;
      - script.execute: zone3_auto_off
    turn_off_action:
      - uart.write: [0xA0, 0x03, 0x00, 0xA3]
      - lambda: id(zone3_on) = false;
      - script.stop: zone3_auto_off
    optimistic: true

  - platform: template
    name: "Zone 4"
    id: relay4
    turn_on_action:
      - uart.write: [0xA0, 0x04, 0x01, 0xA5]
      - lambda: id(zone4_on) = true;
      - script.execute: zone4_auto_off
    turn_off_action:
      - uart.write: [0xA0, 0x04, 0x00, 0xA4]
      - lambda: id(zone4_on) = false;
      - script.stop: zone4_auto_off
    optimistic: true

  - platform: restart
    name: "Sprinkler restart"